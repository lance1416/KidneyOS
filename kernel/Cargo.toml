[package]
name = "kidneyos"
version = "0.1.0"
edition = "2024"

[dependencies]
nom = { version = "8.0.0", default-features = false }

kidneyos-shared.path = "../shared"
spin = { version = "0.12.3", default-features = false, features = ["lazy"] }
zerocopy = { version = "0.8.63", features = ["derive"] }
kidneyos-syscalls.path = "../syscalls"

[features]
default = ["ticket_mutex"]
ticket_mutex = []

[dev-dependencies]
flate2 = "1.1.10"

[lints]
workspace = true
