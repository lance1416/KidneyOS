[package]
name = "kidneyos"
version.workspace = true
edition.workspace = true

[dependencies]
kidneyos-shared.workspace = true
# Only the definitions: the stubs are for user programs, and would replace the
# C library's functions of the same names in the host tests.
kidneyos-syscalls = { workspace = true, default-features = false }
nom.workspace = true
spin = { workspace = true, features = ["spin_mutex"] }
zerocopy.workspace = true

[features]
default = ["ticket_mutex"]
ticket_mutex = []

[dev-dependencies]
flate2 = "1.1.10"

[lints]
workspace = true
