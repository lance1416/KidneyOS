name: Run Checks and Deploy Docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel runs on main, so every merged commit gets its docs deployed.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  checks:
    name: Check clippy, rustfmt, and tests; build ISO and docs
    runs-on: ubuntu-latest
    defaults:
      run:
        # Run every step inside the same devShell that developers use.
        shell: nix develop ./nix#build -i -k CARGO_TERM_COLOR -c bash -euo pipefail {0}
    steps:
    - uses: actions/checkout@v7
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@v23
    - name: Cache Nix store
      uses: DeterminateSystems/magic-nix-cache-action@v15
    - name: Enter devShell
      id: devshell
      run: rustc --version && cargo --version
    - name: Check formatting
      if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
      run: find -name "*.rs" -print0 | xargs -0 rustfmt --quiet --check --edition 2024 --
    # Restored after the formatting check, since build/target contains
    # generated .rs files that rustfmt would otherwise pick up.
    - name: Cache cargo
      uses: actions/cache@v6
      with:
        key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: ${{ runner.os }}-cargo-
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          build/target/
    - name: Build test programs
      id: test-programs
      if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
      run: make -f programs.mk
    - name: Check clippy
      if: ${{ !cancelled() && steps.test-programs.outcome == 'success' }}
      run: cargo-clippy -- --target i686-unknown-linux-gnu -- -Dwarnings
    - name: Run tests
      if: ${{ !cancelled() && steps.test-programs.outcome == 'success' }}
      run: make print-coverage
    - name: Build ISO
      if: ${{ !cancelled() && steps.test-programs.outcome == 'success' }}
      run: make
    - name: Build Docs
      id: docs
      if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
      run: make docs
    - name: Upload Docs Artifact
      if: ${{ !cancelled() && steps.docs.outcome == 'success' && github.event_name == 'push' && github.ref_name == 'main' }}
      uses: actions/upload-pages-artifact@v5
      with:
        path: build/docs
  deploy-docs:
    # This is a separate job so we're not running everything else with the
    # additional permissions required for the deploy step.
    name: Deploy Docs
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    steps:
      - name: Deploy Docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
