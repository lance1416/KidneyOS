# Every job only orchestrates: the work itself is done by make targets, so
# `make check` (plus `make smoke-test` and `make docs`) locally runs the same
# checks as this workflow. Setup shared by the jobs is in
# .github/actions/setup.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel runs on main, so every merged commit gets its docs deployed.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # Run make inside the same devShell that developers use. -i keeps the
    # runner's own toolchains out; -k passes through what the jobs need.
    shell: >-
      nix develop ./nix#build -i
      -k CARGO_TERM_COLOR -k CARGO_INCREMENTAL -k CI -k GITHUB_STEP_SUMMARY
      -c bash -euo pipefail {0}

jobs:
  lint:
    name: Lint (rustfmt, shellcheck, mdsh, actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Nix and the devShell
        uses: ./.github/actions/setup
        with:
          rust-cache: "false"
      - name: Run the quick checks
        run: make check-fast

  build:
    name: Build, clippy and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Nix, the devShell and cargo caches
        uses: ./.github/actions/setup
      - name: Build the user programs
        run: make programs
      - name: Run clippy on both workspaces
        run: make clippy
      - name: Run the tests with coverage
        run: make test
      - name: Add the coverage summary to the job summary
        run: make -s coverage-summary >> "$GITHUB_STEP_SUMMARY"
      - name: Build the ISO
        run: make iso
      - name: Check that generated files are committed
        run: git diff --exit-code
      - name: Upload the ISO
        uses: actions/upload-artifact@v7
        with:
          name: kidneyos-iso
          path: build/i686/kidneyos.iso
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Boot the ISO in QEMU
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Nix and the devShell
        uses: ./.github/actions/setup
        with:
          rust-cache: "false"
      - name: Download the ISO
        uses: actions/download-artifact@v8
        with:
          name: kidneyos-iso
          path: build/i686
      - name: Boot and wait for the shell prompt
        run: make smoke-test-iso

  docs:
    name: Build the docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Nix and the devShell
        uses: ./.github/actions/setup
        with:
          rust-cache: "false"
      - name: Build the book
        run: make docs
      - name: Upload the book for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs

  commit-messages:
    name: Check commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        # Only needs git and make, which the runner has.
        shell: bash
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit in the pull request
        run: make check-commits
        env:
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  deploy:
    name: Deploy the docs to GitHub Pages
    # Only publish docs for a main that passes every check.
    needs: [lint, build, smoke, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
