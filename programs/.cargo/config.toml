# Cargo only reads this file when it is run from inside programs/ (config is
# looked up from the current directory, not from --manifest-path), so
# programs.mk always cd's here first.

[build]
# The standard x86_64 Linux target (with SSE, whose registers the kernel saves
# for each thread).
target = "x86_64-unknown-linux-gnu"
# Relative to programs/. The CARGO_TARGET_DIR environment variable (set by the
# Makefile and the Nix devShell) takes precedence over this.
target-dir = "../build/programs"

# The linker is the default cc on x86_64 hosts; elsewhere the Nix devShell sets
# CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER (see docs/building). KidneyOS
# loads programs at the addresses they're linked at, so they mustn't be PIE.
[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "relocation-model=static",
  "-C", "link-args=-e _start -static -nostartfiles -no-pie",
]
