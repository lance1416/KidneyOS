[toolchain]
# NOTE: If the channel is changed, update the `cargo --version` output shown in
# docs/building/from-source.md.
# nightly-2026-11-01 (rustc 1.101.0-nightly f9ceb4a4d 2026-10-31) was picked as a
# recent nightly that builds KidneyOS cleanly (kernel, programs, tests, clippy,
# rustfmt) and has all of the components below available on x86_64/aarch64
# Linux and macOS. Nightly is still required for unstable features:
# negative_impls (the kernel's lock guards are !Send), and btreemap_alloc in the
# tests.
# - x86_64-unknown-none: the kernel, with the prebuilt core and alloc.
# - x86_64-unknown-linux-gnu: the user programs (see programs/.cargo/config.toml)
#   and the host tests.
# llvm-tools-preview provides llvm-objcopy (for the kernel image) and what grcov
# needs; rust-src is for rust-analyzer.
channel = "nightly-2026-11-01"
components = ["clippy", "llvm-tools-preview", "rustfmt", "rust-analyzer", "rust-src"]
targets = ["x86_64-unknown-none", "x86_64-unknown-linux-gnu"]
profile = "minimal"
