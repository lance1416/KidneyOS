[package]
name = "kidneyos-syscalls"
version.workspace = true
edition.workspace = true

[lib]
# There are no tests, and the syscall stubs (exit, read, write, open, ...) clash
# with the libc symbols std uses when built as a host test binary.
test = false

[features]
default = ["stubs"]
# The system call stubs (exported as C functions); without them, only the
# definitions in `defs` (which the kernel uses).
stubs = []

[dependencies]

[build-dependencies]
cbindgen = { version = "0.29.4", default-features = false }

[lints]
workspace = true
