[package]
name = "kidneyos-syscalls"
version = "0.1.0"
# NOTE: Stays on edition 2021 until cbindgen is upgraded: cbindgen 0.27 ignores
# `#[unsafe(no_mangle)]` (required by edition 2024), which would silently drop
# every function from include/kidneyos.h.
edition = "2021"

[lib]
# There are no tests, and the syscall stubs (exit, read, write, open, ...) clash
# with the libc symbols std uses when built as a host test binary.
test = false

[dependencies]

[build-dependencies]
cbindgen = { version = "0.29.4", default-features = false }

[lints]
workspace = true
