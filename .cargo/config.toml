[build]
# Used for host-side checks (clippy, tests), which run as ordinary Linux
# programs. The kernel is built for x86_64-unknown-none (see the Makefile), and
# the user programs for x86_64-unknown-linux-gnu with their own settings (see
# programs/.cargo/config.toml).
target = "x86_64-unknown-linux-gnu"

# The kernel. The built-in target defaults to a static PIE; the kernel is
# linked at a fixed address (build-support/x86_64.ld), so it uses the static
# relocation model. Frame pointers are kept for backtraces.
[target.x86_64-unknown-none]
rustflags = ["-C", "relocation-model=static", "-C", "force-frame-pointers=yes"]

[alias]
# Lint the kernel like `make clippy` does (the syscall stubs and the user
# programs need `make clippy`).
lint = "clippy --target x86_64-unknown-none --package kidneyos --package kidneyos-shared -- -D warnings"
# Run the tests without coverage instrumentation (`make test` adds it).
t = "test --target x86_64-unknown-linux-gnu --workspace --exclude kidneyos-syscalls"
